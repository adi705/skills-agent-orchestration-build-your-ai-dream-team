<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f5">
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="dashboard">
      <header class="dashboard-header">
        <div class="header-copy">
          <p class="eyebrow"><span class="pulse-dot" aria-hidden="true"></span> Team overview</p>
          <h1>Project Pulse</h1>
          <p class="intro">A clear view of what the team is building, who is moving it forward, and where attention is needed.</p>
        </div>
        <div class="header-note" aria-label="Dashboard purpose">
          <span class="header-note-mark" aria-hidden="true">↗</span>
          <span>Small updates.<br><strong>Shared momentum.</strong></span>
        </div>
      </header>

      <section class="projects-section" aria-labelledby="projects-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">The work in motion</p>
            <h2 id="projects-heading">Team projects</h2>
          </div>
          <p class="project-count" id="project-count" aria-live="polite"></p>
        </div>
        <div class="project-grid" id="project-grid" aria-live="polite" aria-busy="true">
          <p class="message-card">Loading project updates…</p>
        </div>
      </section>
      <footer class="dashboard-footer">A little more context makes collaboration easier.</footer>
    </main>

    <script>
      const projectGrid = document.querySelector("#project-grid");
      const projectCount = document.querySelector("#project-count");

      function makeTextElement(tagName, className, value) {
        const element = document.createElement(tagName);
        element.className = className;
        element.textContent = value;
        return element;
      }

      function renderProject(project) {
        const card = document.createElement("article");
        card.className = "project-card";

        const cardHeading = document.createElement("div");
        cardHeading.className = "project-card-heading";

        const titleGroup = document.createElement("div");
        titleGroup.append(
          makeTextElement("p", "project-label", "Project"),
          makeTextElement("h3", "project-name", project.name)
        );

        const status = makeTextElement("span", "status-badge", project.status);
        status.dataset.status = String(project.status).toLowerCase();
        cardHeading.append(titleGroup, status);

        const summary = makeTextElement("p", "project-summary", project.summary);
        const details = document.createElement("dl");
        details.className = "project-details";

        const owner = document.createElement("div");
        owner.append(
          makeTextElement("dt", "", "Owner"),
          makeTextElement("dd", "", project.owner)
        );

        const priority = document.createElement("div");
        priority.append(
          makeTextElement("dt", "", "Priority"),
          makeTextElement("dd", "priority-value", project.priority)
        );
        priority.querySelector("dd").dataset.priority = String(project.priority).toLowerCase();
        details.append(owner, priority);

        const activity = document.createElement("div");
        activity.className = "recent-activity";
        activity.append(
          makeTextElement("p", "detail-label", "Recent activity"),
          makeTextElement("p", "activity-copy", project.recentActivity)
        );

        card.append(cardHeading, summary, details, activity);
        return card;
      }

      async function loadProjects() {
        try {
          const response = await fetch("project-data.json");
          if (!response.ok) {
            throw new Error(`Project data request failed (${response.status})`);
          }

          const data = await response.json();
          if (!Array.isArray(data.projects)) {
            throw new Error("Project data must contain a projects array.");
          }

          projectGrid.replaceChildren();
          if (data.projects.length === 0) {
            projectGrid.append(makeTextElement("p", "message-card", "No projects to show yet. Check back soon."));
            projectCount.textContent = "0 projects";
            return;
          }

          for (const project of data.projects) {
            projectGrid.append(renderProject(project));
          }
          projectCount.textContent = `${data.projects.length} ${data.projects.length === 1 ? "project" : "projects"}`;
        } catch (error) {
          console.error("Unable to load Project Pulse data.", error);
          projectGrid.replaceChildren(
            makeTextElement("p", "message-card error-message", "Project updates could not be loaded. Please try again later.")
          );
          projectCount.textContent = "";
        } finally {
          projectGrid.setAttribute("aria-busy", "false");
        }
      }

      loadProjects();
    </script>
  </body>
</html>
